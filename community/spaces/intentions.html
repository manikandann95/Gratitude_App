</head>

      <a href="../../index.html" class="nav-logo"><div class="logo-icon">&#10022;</div><span>Cosmos</span></a>

        <a href="../../daily.html">Daily</a><a href="../../journal.html">Journal</a>

          </div>

      <button class="theme-toggle" id="themeToggle">&#9789;</button>

  <div class="page-hero">
    <div class="page-hero-icon">&#127919;</div>
    <h1>Intention Board</h1>
    <p>Set your intentions and share your goals with the tribe. Spoken intentions become reality.</p>
    <div style="margin-top:12px"><a href="../../community.html" style="color:var(--text-muted);font-size:0.8rem;text-decoration:none">&#8592; Back to Community</a></div>
  </div>

  <section style="padding:20px 0 100px">
    <div class="container" style="max-width:760px">
      <!-- Username -->
      <div class="glass" style="border-radius:16px;padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div id="myAvatar" class="avatar-circle" style="background:#ec4899">M</div>
        <input id="myNameInput" class="name-input" placeholder="Your display name..." oninput="updateMyName(this.value)"/>
      </div>

      <!-- Post Create -->
      <div class="post-create-box">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <button class="filter-chip active" onclick="setTF('Life',this)">&#127775; Life</button>
          <button class="filter-chip" onclick="setTF('Today',this)">&#9728; Today</button>
          <button class="filter-chip" onclick="setTF('This Month',this)">&#128197; This Month</button>
          <button class="filter-chip" onclick="setTF('This Year',this)">&#127775; This Year</button>
        </div>
        <textarea class="post-textarea" id="postInput" style="width:100%;margin-bottom:12px" placeholder="My intention is..."></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span style="font-size:0.78rem;color:var(--text-muted)">Timeframe: <strong id="tfDisplay">Life</strong></span>
          <button class="btn btn-primary" onclick="submitPost()">&#10022; Set Intention</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <span style="font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center">Filter:</span>
        <button class="filter-chip active" onclick="filterPosts('all',this)">All</button>
        <button class="filter-chip" onclick="filterPosts('Life',this)">&#127775; Life</button>
        <button class="filter-chip" onclick="filterPosts('Today',this)">&#9728; Today</button>
        <button class="filter-chip" onclick="filterPosts('This Month',this)">&#128197; Month</button>
        <button class="filter-chip" onclick="filterPosts('This Year',this)">&#127881; Year</button>
      </div>

      <div id="postsContainer"></div>
    </div>
  </section>

  <script src="../../js/app.js"></script>
  <script src="../../js/coins.js"></script>
  <script src="../../js/community.js"></script>
  <script>
    const SPACE_ID = 'intentions';
    let currentTF = 'Life';
    let currentFilter = 'all';

    function updateMyName(v) {
      Community.setName(v);
      const av = document.getElementById('myAvatar');
      if (av && v) { av.textContent = v[0].toUpperCase(); av.style.background = Community.hashColor(v); }
    }
    function setTF(tf, btn) {
      currentTF = tf;
      document.querySelectorAll('.post-create-box .filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tfDisplay').textContent = tf;
    }
    function filterPosts(f, btn) {
      currentFilter = f;
      document.querySelectorAll('#postsContainer + * .filter-chip, .container > div:last-of-type .filter-chip').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.filter-chip').forEach(b => { if(b.closest('.post-create-box')) return; b.classList.remove('active'); });
      btn.classList.add('active');
      renderAll();
    }
    function submitPost() {
      const name = document.getElementById('myNameInput').value.trim();
      if (!name) { showToast('Enter your display name first!'); return; }
      Community.setName(name);
      const msg = document.getElementById('postInput').value.trim();
      if (!msg) { showToast('Write your intention!'); return; }
      Community.addPost(SPACE_ID, msg, [currentTF], { timeframe: currentTF });
      document.getElementById('postInput').value = '';
      renderAll();
      showToast('Intention set! The universe is listening. &#10022;');
    }
    function tfClass(tf) {
      return { 'Life':'tf-life', 'Today':'tf-today', 'This Month':'tf-month', 'This Year':'tf-year' }[tf] || 'tf-life';
    }
    function renderAll() {
      let posts = Community.getPosts(SPACE_ID);
      if (currentFilter !== 'all') posts = posts.filter(p => (p.extra||{}).timeframe === currentFilter);
      const container = document.getElementById('postsContainer');
      if (!posts.length) { container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted)">&#127919; No intentions posted yet. Set yours!</div>'; return; }
      container.innerHTML = posts.sort((a,b)=>b.timestamp-a.timestamp).map(p => {
        const tf = (p.extra||{}).timeframe || 'Life';
        const extraHtml = () => `<div style="margin-bottom:10px"><span class="timeframe-badge ${tfClass(tf)}">&#127919; ${tf}</span></div>`;
        return Community.renderPost(p, SPACE_ID, { extraHtml });
      }).join('');
    }
    const n = Community.getMyName();
    const inp = document.getElementById('myNameInput');
    if (inp && n !== 'Anonymous') { inp.value = n; updateMyName(n); }
    renderAll();
    window.currentSpaceRender = renderAll;
    document.querySelectorAll('.nav-dropdown > a').forEach(a => {
      a.addEventListener('click', e => { if(window.innerWidth<=768){e.preventDefault();a.parentElement.classList.toggle('open');} });
    });
  </script>
</body>
</html>
