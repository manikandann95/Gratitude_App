<div class="page-hero">
  <div class="page-hero-icon">&#128226;</div>
  <h1>Announcements &amp; Updates</h1>
  <p>Important news, app updates, and community announcements. Stay in the loop.</p>
  <div style="margin-top:12px"><a href="../../community.html" style="color:var(--text-muted);font-size:0.8rem;text-decoration:none">&#8592; Back to Community</a></div>
</div>
<section style="padding:20px 0 100px"><div class="container" style="max-width:760px">
  <div class="glass" style="border-radius:16px;padding:18px 22px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div id="myAvatar" class="avatar-circle" style="background:#fbbf24">M</div>
    <input id="myNameInput" class="name-input" placeholder="Your display name..." oninput="updateMyName(this.value)"/>
  </div>
  <div class="post-create-box">
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button class="filter-chip active" onclick="setType('Announcement',this)">&#128226; Announcement</button>
      <button class="filter-chip" onclick="setType('Update',this)">&#9989; Update</button>
      <button class="filter-chip" onclick="setType('News',this)">&#127757; News</button>
    </div>
    <textarea class="post-textarea" id="postInput" style="width:100%;margin-bottom:10px" placeholder="Write your announcement..."></textarea>
    <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" onclick="submitPost()">&#128226; Post</button></div>
  </div>
  <div id="postsContainer"></div>
</div></section>
  <script src="../../js/app.js"></script>
  <script src="../../js/coins.js"></script>
  <script src="../../js/community.js"></script>
  <script>
    document.querySelectorAll('.nav-dropdown > a').forEach(a => {
      a.addEventListener('click', e => { if(window.innerWidth<=768){e.preventDefault();a.parentElement.classList.toggle('open');} });
    });
  </script>
<script>
const SPACE_ID = 'announcements';
let aType = 'Announcement';
function updateMyName(v) { Community.setName(v); const av=document.getElementById('myAvatar'); if(av&&v){av.textContent=v[0].toUpperCase();av.style.background=Community.hashColor(v);} }
function setType(t,btn) { aType=t; document.querySelectorAll('.post-create-box .filter-chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function submitPost() {
  const name=document.getElementById('myNameInput').value.trim();
  if(!name){showToast('Enter your name!');return;}
  Community.setName(name);
  const msg=document.getElementById('postInput').value.trim();
  if(!msg){showToast('Write something!');return;}
  Community.addPost(SPACE_ID,msg,[aType],{type:aType});
  document.getElementById('postInput').value='';
  renderAll(); showToast('Announcement posted!');
}
function renderAll() {
  const posts = Community.getPosts(SPACE_ID).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.timestamp-a.timestamp);
  const c = document.getElementById('postsContainer');
  if(!posts.length){c.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">&#128226; No announcements yet.</div>';return;}
  c.innerHTML = posts.map(p => {
    const t = (p.extra||{}).type||'Announcement';
    const extraHtml = () => <div style="margin-bottom:8px"><span class="tag-chip "></span></div>;
    return Community.renderPost(p, SPACE_ID, { extraHtml, canPin: true });
  }).join('');
}
window.currentSpaceRender = renderAll;
const n=Community.getMyName(); const inp=document.getElementById('myNameInput');
if(inp&&n!=='Anonymous'){inp.value=n;updateMyName(n);}
renderAll();
</script>
