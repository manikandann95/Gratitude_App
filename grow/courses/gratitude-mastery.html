  <main class="container">
    <div class="page-hero glass" style="margin-bottom:24px;">
      <a href="../../grow.html?tab=courses" style="color:var(--primary-color);text-decoration:none;display:inline-block;margin-bottom:16px;">&larr; Back to Courses</a>
      <div class="hero-icon" style="font-size:3rem;">&#128149;</div>
      <h1>Gratitude Mastery</h1>
      <p>Master the art and science of gratitude. Go from surface-level thanks to deep transformative appreciation.</p>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start" id="courseLayout">
      <div class="glass" style="border-radius:20px;padding:20px;position:sticky;top:90px">
        <div style="margin-bottom:16px">
          <div class="course-progress-bar"><div class="course-progress-fill" id="sidebarProgress" style="width:0%"></div></div>
          <div class="course-progress-text" id="progressText" style="margin-top:8px;">0% complete</div>
        </div>
        <div class="lesson-sidebar" id="lessonSidebar"></div>
      </div>
      <div class="lesson-content-area glass" id="lessonContent" style="border-radius:20px;padding:32px;"></div>
    </div>
  </main>

  <script>
    const courseId = 'gratitude-mastery';
    const lessons = [
      {
        title: 'The Science of Gratitude',
        content: '<p>fMRI research, dopamine and serotonin, neuroplasticity.</p><h3>Exercise</h3><p>Write about a time gratitude shifted your mood instantly.</p>'
      },
      {
        title: 'Deep Gratitude vs Surface Gratitude',
        content: '<p>The difference between listing and feeling, embodied gratitude practice.</p><h3>Exercise</h3><p>Pick ONE thing and write 10 reasons you are grateful for it.</p>'
      },
      {
        title: 'Gratitude Scripting Mastery',
        content: '<p>Writing in present tense, adding emotion, the 6 areas framework.</p><h3>Exercise</h3><p>Write a full gratitude script for your ideal day.</p>'
      },
      {
        title: 'Gratitude for the Difficult',
        content: '<p>Finding gifts in challenges, shadow gratitude, Viktor Frankl approach.</p><h3>Exercise</h3><p>Find 3 difficult events in your life and write what they gave you.</p>'
      },
      {
        title: 'Living as a Gratitude Master',
        content: '<p>Daily integration, gratitude partnerships, sharing the practice.</p><h3>Exercise</h3><p>Commit to one daily gratitude practice and schedule it now.</p>'
      }
    ];

    function loadLesson(index) {
      document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.getElementById('lesson-item-'+index);
      if(activeItem) activeItem.classList.add('active');

      const isCompleted = localStorage.getItem(`cosmos-lesson-${courseId}-${index}`) === 'true';
      const lesson = lessons[index];
      const contentHtml = `
        <h2 style="margin-bottom:24px;">Lesson ${index+1}: ${lesson.title}</h2>
        <div style="line-height:1.6;margin-bottom:32px;font-size:1.1rem;color:rgba(255,255,255,0.9);">${lesson.content}</div>
        <button class="btn btn-primary" onclick="markComplete(${index})" ${isCompleted?'disabled':''}>
          ${isCompleted ? 'Completed &#10003;' : 'Mark Complete'}
        </button>
      `;
      document.getElementById('lessonContent').innerHTML = contentHtml;
    }

    function markComplete(index) {
      localStorage.setItem(`cosmos-lesson-${courseId}-${index}`, 'true');
      updateProgress();
      loadLesson(index);
      renderSidebar();
    }

    function updateProgress() {
      let completed = 0;
      for(let i=0; i<lessons.length; i++) {
        if(localStorage.getItem(`cosmos-lesson-${courseId}-${i}`) === 'true') completed++;
      }
      const prog = Math.round((completed / lessons.length) * 100);
      localStorage.setItem('cosmos-course-progress-'+courseId, prog);
      document.getElementById('sidebarProgress').style.width = prog + '%';
      document.getElementById('progressText').innerText = prog + '% complete';
    }

    function renderSidebar() {
      const sidebar = document.getElementById('lessonSidebar');
      sidebar.innerHTML = '';
      lessons.forEach((l, i) => {
        const isCompleted = localStorage.getItem(`cosmos-lesson-${courseId}-${i}`) === 'true';
        sidebar.innerHTML += `
          <div class="lesson-item" id="lesson-item-${i}" onclick="loadLesson(${i})" style="padding:12px;cursor:pointer;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
            <div class="lesson-check" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--primary-color);display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:var(--primary-color);">
              ${isCompleted ? '&#10003;' : ''}
            </div>
            <div class="lesson-name" style="font-size:0.95rem;">${l.title}</div>
          </div>
        `;
      });
    }

    updateProgress();
    renderSidebar();
    loadLesson(0);

    if(window.innerWidth < 768) {
      document.getElementById('courseLayout').style.gridTemplateColumns = '1fr';
    }
  </script>
</body>
</html>
